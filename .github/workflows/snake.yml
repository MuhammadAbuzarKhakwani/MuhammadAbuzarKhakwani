name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main               # regenerates whenever you push to main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: MuhammadAbuzarKhakwani
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23E8441A&color_dots=060608,060608,4B6EF5,4B6EF5,E8441A
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23E8441A&color_dots=0D1117,0D1117,4B6EF5,4B6EF5,E8441A

      - name: Push output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
